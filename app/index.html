<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="dashboard__header">
        <div>
          <h1 class="dashboard__title">Project Pulse</h1>
          <p class="dashboard__subtitle">A quick view of active work, status updates, and priorities.</p>
        </div>
      </header>

      <div id="projectGrid" class="project-grid" aria-live="polite"></div>
    </main>

    <script>
      async function renderProjects() {
        try {
          const response = await fetch('project-data.json');
          const data = await response.json();
          const grid = document.getElementById('projectGrid');

          if (!data.projects || !Array.isArray(data.projects)) {
            grid.innerHTML = '<p>Unable to load project data.</p>';
            return;
          }

          grid.innerHTML = data.projects
            .map((project) => {
              return `
                <article class="project-card">
                  <h2 class="project-card__title">${project.name}</h2>
                  <div class="project-card__meta">
                    <span class="status-badge">${project.status}</span>
                    <span class="priority-badge">${project.priority}</span>
                    <span>Owner: ${project.owner}</span>
                  </div>
                  <div class="project-card__section">
                    <span class="project-card__label">Recent activity</span>
                    <p class="project-card__text">${project.recentActivity}</p>
                  </div>
                </article>
              `;
            })
            .join('');
        } catch (error) {
          document.getElementById('projectGrid').innerHTML = '<p>Failed to load project data.</p>';
          console.error(error);
        }
      }

      renderProjects();
    </script>
  </body>
</html>
